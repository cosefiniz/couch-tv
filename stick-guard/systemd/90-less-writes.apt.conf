// Fewer writes to a small eMMC: keep package lists compressed, do not keep downloaded packages,
// and clean the package cache weekly. Security updates still run every day.
// Copy to /etc/apt/apt.conf.d/90-less-writes, then: sudo apt-get clean
Acquire::GzipIndexes "true";
Acquire::CompressionTypes::Order:: "gz";
APT::Keep-Downloaded-Packages "false";
APT::Periodic::AutocleanInterval "7";
Binary::apt::APT::Keep-Downloaded-Packages "false";
